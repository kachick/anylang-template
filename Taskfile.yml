# https://taskfile.dev/styleguide/
# Keep tasks short (1-2 lines). Do not write long scripts here; put them into files under scripts/ instead.

version: '3'

tasks:
  default:
    deps:
      - task: fmt
      - task: lint
      - task: test
  check:
    deps:
      - task: test
      - task: lint
  test:
    cmds:
      - echo 'Update here'
  fmt:
    cmds:
      - dprint fmt
  lint:
    cmds:
      - dprint check
      - typos . .github
      - zizmor --pedantic .
