# https://taskfile.dev/styleguide/
# Keep each task to a single command. Do not chain commands (such as with ; or &&); put scripts into files under scripts/ instead.

version: '3'

tasks:
  default:
    deps:
      - task: fmt
      - task: lint
      - task: test
  check:
    deps:
      - task: test
      - task: lint
  test:
    cmds:
      - echo 'Update here'
  fmt:
    cmds:
      - dprint fmt
  lint:
    cmds:
      - dprint check
      - typos . .github
      - zizmor --pedantic .
      - renovate-config-validator --strict .github/renovate.jsonc
